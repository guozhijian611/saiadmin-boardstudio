name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: boardstudio-packages
          path: dist
      - name: Validate release tag and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Board Studio ${RELEASE_TAG}" --notes-file CHANGELOG.md "${FLAGS[@]}"
